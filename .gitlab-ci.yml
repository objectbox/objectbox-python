stages:
  - build
  - test

# First, build the source and package it as a python wheel
build:
  tags: [x64, docker, linux]
  image: python:latest
  stage: build
  script:
    # a function to download a library from another Gitlab repos CI artifacts
    # URLs stored as CI variables, see https://docs.gitlab.com/ee/api/job_artifacts.html#download-a-single-artifact-file-from-specific-tag-or-branch
    # FIXME Need to update URLs and extract from archives.
    #- 'download_library(){ curl --create-dirs -o objectbox/lib/$1 -H "PRIVATE-TOKEN: $CI_API_TOKEN" $2; }'
    #- 'download_library x86_64/libobjectbox.so "${OBXLIB_URL_Linux64}"'
    #- 'download_library x86_64/libobjectbox.dylib "${OBXLIB_URL_Mac64}"'
    #- 'download_library armv7l/libobjectbox.so "${OBXLIB_URL_LinuxARMv7hf}"'
    #- 'download_library armv6l/libobjectbox.so "${OBXLIB_URL_LinuxARMv6hf}"'
    #- 'download_library AMD64/objectbox.dll "${OBXLIB_URL_Win64}"'
    - python -m pip install --upgrade pip
    # Using released C library
    - make depend
    - make test
    - make build
  artifacts:
    expire_in: 1 days
    paths:
      - dist/*.whl

# Build the objectbox-sync-clib wheels (the Sync variant of the C library) and the objectbox-sync metapackage;
# it uses the objectbox-api wheel built by "build"
build-sync:
  tags: [ x64, docker, linux ]
  image: python:latest
  stage: build
  script:
    - python -m pip install --upgrade pip
    # Using released C library (Sync version)
    - make depend-sync
    - make test
    - make build-sync
  artifacts:
    expire_in: 1 days
    paths:
      - dist/*.whl

# Next, test the packaged wheels built by "build": the objectbox metapackage, i.e. objectbox-api and objectbox-clib
.test:
  stage: test
  script:
    - pip3 install --user pytest
    - rm -r objectbox  # todo this is ugly; let's copy required files in a sub-folder instead?
    - rm -r objectbox_clib  # todo this is ugly; let's copy required files in a sub-folder instead?
    - rm -r objectbox_sync_clib  # Separate command for PowerShell (Windows)
    # Artifacts from the previous stage (downloaded by default). Note: wheel file names use "_", so objectbox-*.whl only
    # matches the metapackage; objectbox-api and objectbox-clib (for the platform) are installed via --find-links.
    - pip3 install --user --force-reinstall dist/objectbox-*.whl --find-links dist
    - ${PYTHON} -m pytest -rs  # -rs: list skipped tests with reason
    - ${PYTHON} -m pytest -rs --fast-flatbuffers-builder  # experimental; each object is verified against the reference
    - ${PYTHON} -m pytest -rs --flatbuffers-codegen  # experimental; each object is verified against the reference
  variables:
    PYTHON: "python3"

# For shell runners with a system Python that is "externally managed" (PEP 668), i.e. disallows pip install --user.
# The venv is re-created for each job (git clean), but pip's cache (~/.cache/pip on the runner host) persists,
# so packages are not downloaded (or built, e.g. numpy on armv7) again.
.test:venv:
  extends: .test
  script:
    - ${PYTHON} -m venv .venv
    - source .venv/bin/activate
    - python -m pip install pytest
    - rm -r objectbox  # todo this is ugly; let's copy required files in a sub-folder instead?
    - rm -r objectbox_clib objectbox_sync_clib
    - python -m pip install --force-reinstall dist/objectbox-*.whl --find-links dist  # See .test
    - python -m pytest -rs
    - python -m pytest -rs --fast-flatbuffers-builder
    - python -m pytest -rs --flatbuffers-codegen

test:linux:x64:
  extends: .test
  tags: [x64, docker, linux]
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      # Note: Docker images will have an arbitrary minor version due to "if-not-present" pull policy.
      #       If this becomes a problem, we could e.g. specify a minor version explicitly.
      - PYTHON_VERSION: [ '3.7', '3.8', '3.9', '3.10', '3.11', '3.12']

test:linux:armv7hf:
  extends: .test:venv
  tags: [armv7hf, shell, linux, python3]

test:linux:aarch64:
  extends: .test:venv
  tags: [aarch64, shell, linux, python3]

test:mac:
  extends: .test:venv
  # CPU agnostic: the wheel ships a universal macOS library (x64 and arm64)
  tags: [mac, arm64]

test:windows:x64:
  extends: .test
  tags: [windows, x64, python]
  variables:
    PYTHON: "python.exe"

# Sync version test jobs: test the objectbox-sync metapackage, i.e. objectbox-api and objectbox-sync-clib (without
# objectbox-clib)
.test-sync:
  stage: test
  needs: [ build, build-sync ]
  script:
    - pip3 install --user pytest
    - rm -r objectbox  # todo this is ugly; let's copy required files in a sub-folder instead?
    - rm -r objectbox_clib objectbox_sync_clib
    - pip3 install --user --force-reinstall dist/objectbox_sync-*.whl --find-links dist  # Artifacts from build and build-sync
    - ${PYTHON} -c "import importlib.util; assert importlib.util.find_spec('objectbox_clib') is None, 'objectbox-clib must not be installed'"
    - ${PYTHON} -m pytest -s -rs
  variables:
    PYTHON: "python3"

.test-sync:venv:
  extends: .test-sync
  script:
    - ${PYTHON} -m venv .venv
    - source .venv/bin/activate
    - python -m pip install pytest
    - rm -r objectbox  # todo this is ugly; let's copy required files in a sub-folder instead?
    - rm -r objectbox_clib objectbox_sync_clib
    - python -m pip install --force-reinstall dist/objectbox_sync-*.whl --find-links dist  # Artifacts from build and build-sync
    - python -c "import importlib.util; assert importlib.util.find_spec('objectbox_clib') is None, 'objectbox-clib must not be installed'"
    - python -m pytest -s -rs

test-sync:linux:x64:
  extends: .test-sync
  tags: [ x64, docker, linux ]
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: [ '3.7', '3.8', '3.9', '3.10', '3.11', '3.12' ]

test-sync:linux:aarch64:
  extends: .test-sync:venv
  tags: [ aarch64, shell, linux, python3 ]

test-sync:mac:
  extends: .test-sync:venv
  tags: [ mac, arm64 ]
