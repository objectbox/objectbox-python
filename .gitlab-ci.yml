stages:
  - build
  - test

# First, build the source and package it as a python wheel
build:
  tags: [x64, docker, linux]
  image: python:latest
  stage: build
  script:
    # a function to download a library from another Gitlab repos CI artifacts
    # URLs stored as CI variables, see https://docs.gitlab.com/ee/api/job_artifacts.html#download-a-single-artifact-file-from-specific-tag-or-branch
    # FIXME Need to update URLs and extract from archives.
    #- 'download_library(){ curl --create-dirs -o objectbox/lib/$1 -H "PRIVATE-TOKEN: $CI_API_TOKEN" $2; }'
    #- 'download_library x86_64/libobjectbox.so "${OBXLIB_URL_Linux64}"'
    #- 'download_library x86_64/libobjectbox.dylib "${OBXLIB_URL_Mac64}"'
    #- 'download_library armv7l/libobjectbox.so "${OBXLIB_URL_LinuxARMv7hf}"'
    #- 'download_library armv6l/libobjectbox.so "${OBXLIB_URL_LinuxARMv6hf}"'
    #- 'download_library AMD64/objectbox.dll "${OBXLIB_URL_Win64}"'
    - python -m pip install --upgrade pip
    # Using released C library
    - make depend
    - make test
    - make build
  artifacts:
    expire_in: 1 days
    paths:
      - dist/*.whl

# Next, test the packaged wheel built by "build"
.test:
  stage: test
  script:
    - pip3 install --user pytest
    - rm -r objectbox  # todo this is ugly; let's copy required files in a sub-folder instead?
    - rm -r objectbox_clib  # todo this is ugly; let's copy required files in a sub-folder instead?
    - pip3 install --user --force-reinstall dist/objectbox-*.whl --find-links dist  # Artifacts from the previous stage (downloaded by default); objectbox-clib for the platform via --find-links
    - ${PYTHON} -m pytest
  variables:
    PYTHON: "python3"

# For shell runners with a system Python that is "externally managed" (PEP 668), i.e. disallows pip install --user.
# The venv is re-created for each job (git clean), but pip's cache (~/.cache/pip on the runner host) persists,
# so packages are not downloaded (or built, e.g. numpy on armv7) again.
.test:venv:
  extends: .test
  script:
    - ${PYTHON} -m venv .venv
    - source .venv/bin/activate
    - python -m pip install pytest
    - rm -r objectbox  # todo this is ugly; let's copy required files in a sub-folder instead?
    - rm -r objectbox_clib
    - python -m pip install --force-reinstall dist/objectbox-*.whl --find-links dist  # Artifacts from the previous stage (downloaded by default); objectbox-clib for the platform via --find-links
    - python -m pytest

test:linux:x64:
  extends: .test
  tags: [x64, docker, linux]
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      # Note: Docker images will have an arbitrary minor version due to "if-not-present" pull policy.
      #       If this becomes a problem, we could e.g. specify a minor version explicitly.
      - PYTHON_VERSION: [ '3.7', '3.8', '3.9', '3.10', '3.11', '3.12']

test:linux:armv7hf:
  extends: .test:venv
  tags: [armv7hf, shell, linux, python3]

test:linux:aarch64:
  extends: .test:venv
  tags: [aarch64, shell, linux, python3]

test:mac:
  extends: .test:venv
  # CPU agnostic: the wheel ships a universal macOS library (x64 and arm64)
  tags: [mac, arm64]

test:windows:x64:
  extends: .test
  tags: [windows, x64, python]
  variables:
    PYTHON: "python.exe"
